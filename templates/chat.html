<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agente Inteligente 2025</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b35;
      --primary-hover: #ff8c42;
      --secondary: #f97316;
      --bg: #0a0a0a;
      --card: rgba(255, 255, 255, 0.05);
      --text: #f5f5f5;
      --border: rgba(255, 255, 255, 0.1);
      --sidebar-bg: rgba(255, 255, 255, 0.03);
      --messages-bg: #1a1a1a;
      --input-bg: #1e1e1e;
      --bot-msg-bg: #2a2a2a;
      --bot-msg-text: #f1f5f9;
    }

    [data-theme="light"] {
      --primary: #ff6b35;
      --primary-hover: #e55a2b;
      --secondary: #f97316;
      --bg: #ffffff;
      --card: rgba(0, 0, 0, 0.05);
      --text: #1a1a1a;
      --border: rgba(0, 0, 0, 0.1);
      --sidebar-bg: rgba(0, 0, 0, 0.03);
      --messages-bg: #f5f5f5;
      --input-bg: #ffffff;
      --bot-msg-bg: #e5e5e5;
      --bot-msg-text: #1a1a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      transition: background 0.3s ease;
    }

    #sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    #sidebar h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0;
    }

    /* Toggle Switch */
    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
    }

    .theme-toggle .material-icons {
      font-size: 20px;
      padding: 4px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .theme-toggle .active {
      background: var(--primary);
      color: white;
    }

    .session {
      background: var(--card);
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .session:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateX(4px);
    }

    #new-session-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-top: auto;
    }

    #new-session-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }

    /* Chat container */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      padding: 30px 20px;
      overflow-y: auto;
      background: var(--messages-bg);
      transition: background 0.3s ease;
    }

    .message-wrapper {
      display: flex;
      margin: 10px 0;
    }

    .message-wrapper.left {
      justify-content: flex-end;
    }

    .message-wrapper.right {
      justify-content: flex-start;
    }

    .message {
      padding: 14px 20px;
      border-radius: 18px;
      max-width: 70%;
      line-height: 1.6;
      background: var(--card);
      backdrop-filter: blur(8px);
      color: var(--text);
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-wrap: break-word;
      transition: all 0.3s ease;
    }

    .user-msg {
      background: var(--primary);
      color: white;
      border-bottom-left-radius: 0;
      border: none;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.2);
    }

    .bot-msg {
      background: var(--bot-msg-bg);
      color: var(--bot-msg-text);
      border-bottom-right-radius: 0;
      overflow-x: auto;
    }
    /* HTML <style> - ESTILOS QUE USAN VARIABLES DE TEMA */

    /* Estilo para el contenedor general del informe */
    .bot-report {
      font-family: 'Segoe UI', sans-serif; 
      line-height: 1.6;
      color: var(--bot-msg-text); /* El texto del informe usa el color dinámico */
    }

    /* Estilos de encabezados (generados por Markdown) */
    .bot-report h1,
    .bot-report h2,
    .bot-report h3,
    .bot-report h4,
    .bot-report p,
    .bot-report li {
        color: var(--bot-msg-text); /* Asegura que todos los elementos hereden el color correcto */
    }

    /* Estilo para el contenedor general de la tabla (el div 'aigr-card') */
    .aigr-card {
      background: var(--bot-msg-bg);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 0 8px var(--card); 
      margin-top: 10px;
      color: var(--bot-msg-text); /* Título de la tabla */
    }

    /* Estilos de la tabla en sí (elemento <table>) */
    .aigr-table {
      border-collapse: collapse;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
      margin-top: 12px;
      color: var(--bot-msg-text); 
    }

    .aigr-table th {
      background: var(--sidebar-bg); /* Fondo del encabezado */
      color: var(--primary); /* Texto del encabezado en color principal */
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
    }

    .aigr-table td {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      font-size: 0.95rem;
      color: var(--bot-msg-text); /* Texto de las celdas */
      background-color: var(--messages-bg); /* Fondo de la celda */
    }

    /* Filas pares con ligero contraste */
    .aigr-table tr:nth-child(even) td {
      background-color: var(--bot-msg-bg); 
    }

    /* Estilo para el pie de nota de la tabla (reemplaza el style en línea) */
    .table-footer,
    .error-message { 
        font-size: 0.85rem;
        color: var(--border); /* Un color sutil */
        margin-top: 8px;
    }
    .bot-msg table, 
    .bot-msg th, 
    .bot-msg td {
      color: var(--bot-msg-text) !important;
    }

    .bot-msg strong {
      color: var(--primary);
    }

    /* Input area */
    #input-area {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      transition: background 0.3s ease;
    }

    #user-input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      transition: all 0.3s ease;
    }

    #user-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    .chat-btn {
      background: var(--card);
      border: 1px solid var(--border);
      margin-left: 10px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .chat-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
    }

    .material-icons {
      font-size: 20px;
    }

    #file-input {
      display: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-hover);
    }

    @media (max-width: 768px) {
      #sidebar {
        display: none;
      }

      body {
        flex-direction: column;
      }

      #input-area {
        flex-wrap: wrap;
      }

      .chat-btn {
        margin-top: 10px;
      }
    }

  </style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>💬 Sesiones</h2>
    <div class="theme-toggle" id="theme-toggle">
      <span class="material-icons" id="light-icon">light_mode</span>
      <span class="material-icons active" id="dark-icon">dark_mode</span>
    </div>
  </div>
  <div id="sessions"></div>
  <button id="new-session-btn">+ Nueva sesión</button>
  <input type="file" id="file-input" />
</div>

<!-- Chat Container -->
<div id="chat-container">
  <div id="messages"></div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Escribe tu mensaje..." />
    <button class="chat-btn" id="file-btn" title="Subir archivo">
      <span class="material-icons">attach_file</span>
    </button>
    <button class="chat-btn" id="voice-btn" title="Hablar">
      <span class="material-icons">mic</span>
    </button>
    <button class="chat-btn" id="send-btn" title="Enviar">
      <span class="material-icons">send</span>
    </button>
  </div>
</div>

<script>
let currentSessionId = null;
let currentFile = null;

// Theme Toggle
const themeToggle = document.getElementById('theme-toggle');
const lightIcon = document.getElementById('light-icon');
const darkIcon = document.getElementById('dark-icon');
const html = document.documentElement;

// Cargar tema guardado
const savedTheme = localStorage.getItem('theme') || 'dark';
html.setAttribute('data-theme', savedTheme);
updateThemeIcons(savedTheme);

themeToggle.addEventListener('click', () => {
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeIcons(newTheme);
});

function updateThemeIcons(theme) {
  if (theme === 'dark') {
    lightIcon.classList.remove('active');
    darkIcon.classList.add('active');
  } else {
    darkIcon.classList.remove('active');
    lightIcon.classList.add('active');
  }
}

// Cargar sesiones anteriores
function loadSessions() {
    fetch("/sessions")
        .then(res => res.json())
        .then(data => {
            const sessionsDiv = document.getElementById("sessions");
            sessionsDiv.innerHTML = '';
            data.sessions.forEach(s => {
                const div = document.createElement("div");
                div.className = "session";
                div.innerText = s.session_id + " (" + s.msg_count + " msgs)";
                div.onclick = () => selectSession(s.session_id);
                sessionsDiv.appendChild(div);
            });
        });
}

// Seleccionar sesión
function selectSession(sessionId) {
    currentSessionId = sessionId;
    fetch(`/history?session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = '';
            data.history.forEach(msg => {
                appendMessage(msg.message, msg.role === "user" ? "user-msg" : "bot-msg");
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

    fetch(`/get_active_file?session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            currentFile = data.file || null;
        });
}

// Cargar historial de la sesión actual
function loadHistory() {
    if (!currentSessionId) return;
    fetch(`/history?session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = '';
            data.history.forEach(msg => {
                appendMessage(msg.message, msg.role==="user"?"user-msg":"bot-msg");
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
}

// Enviar mensaje
function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendMessage(text, 'user-msg');

    fetch("/chat", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            message: text,
            session_id: currentSessionId,
            uploaded_file: currentFile
        })
    })
    .then(res => res.json())
    .then(data => {
        appendMessage(data.response, 'bot-msg');
        currentSessionId = data.session_id;
        currentFile = data.source_file || currentFile;
    });
}

// Añade mensaje al chat
function appendMessage(msg, cls) {
    const messagesDiv = document.getElementById("messages");

    const wrapper = document.createElement("div");
    wrapper.className = "message-wrapper " + (cls === "user-msg" ? "left" : "right");

    const div = document.createElement("div");
    div.className = "message " + cls;
    
    // 1. Inyectar el HTML que incluye el div del gráfico y el script
    div.innerHTML = msg;

    wrapper.appendChild(div);
    messagesDiv.appendChild(wrapper);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    // 2. 💡 CRÍTICO: Buscar y ejecutar los scripts inyectados (solo si es un mensaje de bot)
    if (cls === "bot-msg") {
        const scripts = div.querySelectorAll("script");
        scripts.forEach(script => {
            const newScript = document.createElement('script');
            // Copiar atributos (como type) y contenido
            if (script.src) {
                newScript.src = script.src;
            } else {
                newScript.textContent = script.textContent;
            }
            
            // Eliminar el script antiguo y ejecutar el nuevo
            script.parentNode.removeChild(script); 
            div.appendChild(newScript);
        });
    }
}
// Botones
document.getElementById("send-btn").onclick = sendMessage;
document.getElementById("user-input").addEventListener("keydown", e => { if(e.key==="Enter") sendMessage(); });

document.getElementById("file-btn").onclick = () => document.getElementById("file-input").click();
document.getElementById("file-input").addEventListener("change", function() {
    const file = this.files[0];
    const formData = new FormData();
    formData.append("file", file);
    fetch("/upload", {method:"POST", body:formData})
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            currentFile = file.name;
        });
});

// VOZ
let mediaRecorder;
let audioChunks = [];

const voiceBtn = document.getElementById("voice-btn");

voiceBtn.onclick = async () => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append("file", audioBlob, "audio.wav");

            try {
                const res = await fetch("/voice", { method: "POST", body: formData });
                const data = await res.json();
                if (data.error) {
                    alert("❌ Error transcripción: " + data.error);
                } else {
                    const transcription = data.transcription;
                    appendMessage(transcription, "user-msg");

                    fetch("/chat", {
                        method: "POST",
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: transcription,
                            session_id: currentSessionId
                        })
                    })
                    .then(res => res.json())
                    .then(chatData => {
                        appendMessage(chatData.response, "bot-msg");
                    });
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error enviando audio");
            }
        };

        mediaRecorder.start();
        voiceBtn.innerHTML = '<span class="material-icons">stop</span>';
    } else if (mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        voiceBtn.innerHTML = '<span class="material-icons">mic</span>';
    }
};

// Nueva sesión
document.getElementById("new-session-btn").onclick = () => {
    fetch("/new_session")
        .then(res => res.json())
        .then(data => {
            currentSessionId = data.session_id;
            currentFile = null;
            document.getElementById("messages").innerHTML = '';
            document.getElementById("file-input").value = '';
            loadSessions();
        });
};

// Inicializar
loadSessions();
loadHistory();

</script>

</body>
</html>
